            padding: 20px;

            background-color: #fdf6e3;

            margin-bottom: 15px;
            font-family: Georgia, serif;
            white-space: pre-wrap; /* Mantém as quebras de linha de poemas */

        .ai-prompt {
            background-color: #e2e8f0;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.9em;
            color: #4a5568;
            margin-bottom: 15px;
            border-left: 4px solid #4a5568;
        }
        .options { list-style-type: none; padding: 0; }
        .options li {
            margin: 8px 0;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            transition: background-color 0.2s;
        }
        .options li:hover { background: #edf2f7; }
        .options label {
            display: block;
            padding: 12px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }
        .options input[type="radio"] { margin-right: 12px; transform: scale(1.2); }
        button {
            display: block; width: 100%; padding: 15px;
            background-color: #805ad5; color: white;
            border: none; border-radius: 8px;
            font-size: 1.2em; font-weight: bold;
            cursor: pointer; transition: background 0.3s; margin-top: 30px;
        }
        button:hover { background-color: #6b46c1; }
        #result-container {
            display: none; background-color: #fff; border-radius: 8px;
            padding: 30px; margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-top: 6px solid #38a169;
        }
        .result-item {
            display: flex; justify-content: space-between;
            padding: 12px 0; border-bottom: 1px solid #edf2f7; font-size: 1.1em;
        }

            font-size: 1.3em; font-weight: bold; background-color: #f0fff4;

        .q-title { font-weight: bold; margin-bottom: 5px; }
        .q-answer { font-size: 0.9em; color: #4a5568; margin-top: 5px; }

                    { text: "O fechamento das fronteiras comerciais entre os países para proteger as indústrias nacionais.", isCorrect: false },
                    { text: "A desconcentração industrial em escala global, com empresas buscando países com mão de obra mais barata e vantagens fiscais.", isCorrect: true },
                    { text: "O retorno das populações urbanas para o campo em todos os países desenvolvidos.", isCorrect: false },
                    { text: "A igualdade social alcançada entre os países do Norte e do Sul global.", isCorrect: false },
                    { text: "A diminuição drástica no uso de modais de transporte como navios e aviões de carga.", isCorrect: false }
                ]
            },
            {
                discipline: "Geografia",
                text: "O rápido processo de urbanização brasileiro, ocorrido principalmente na segunda metade do século XX, provocou o fenômeno da 'macrocefalia urbana'. Isso significa que:",
                options: [
                    { text: "As cidades brasileiras cresceram de forma perfeitamente planejada e equilibrada.", isCorrect: false },
                    { text: "Houve uma concentração exagerada de população e serviços em poucas grandes metrópoles, gerando problemas estruturais (favelização, trânsito).", isCorrect: true },
                    { text: "O crescimento populacional ocorreu apenas nas áreas litorâneas turísticas.", isCorrect: false },
                    { text: "O campo se desenvolveu mais rapidamente que a cidade, invertendo o fluxo migratório.", isCorrect: false },
                    { text: "Apenas capitais na Região Norte apresentaram crescimento populacional.", isCorrect: false }
                ]
            }
        ];

        const disciplineOrder = ["Língua Portuguesa", "Matemática", "Ciências", "História", "Geografia"];

        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        let orderedAndShuffledQuestions = [];

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = ""; 
            orderedAndShuffledQuestions = []; 

            let globalQuestionIndex = 1;

            disciplineOrder.forEach(disciplineName => {
                let questionsOfDiscipline = questionsData.filter(q => q.discipline === disciplineName);
                questionsOfDiscipline = shuffleArray(questionsOfDiscipline);

                if(questionsOfDiscipline.length > 0) {
                    let sectionTitle = document.createElement('h2');
                    sectionTitle.className = 'discipline-section';
                    sectionTitle.innerText = disciplineName;
                    container.appendChild(sectionTitle);

                    questionsOfDiscipline.forEach(q => {
                        q.displayNumber = globalQuestionIndex;
                        orderedAndShuffledQuestions.push(q);
                        
                        let shuffledOptions = shuffleArray([...q.options]);

                        let qDiv = document.createElement('div');
                        qDiv.className = 'question-card';
                        
                        let questionHTML = `
                            <h3>Questão ${globalQuestionIndex}</h3>
                            <p>${q.text}</p>
                            <ul class="options">
                        `;

                        shuffledOptions.forEach(opt => {
                            let safeText = opt.text.replace(/"/g, '&quot;');
                            questionHTML += `
                                <li>
                                    <label>
                                        <input type="radio" name="q${globalQuestionIndex}" value="${opt.isCorrect}" required>
                                        ${opt.text}
                                    </label>
                                </li>
                            `;
                        });

                        questionHTML += `</ul>`;
                        qDiv.innerHTML = questionHTML;
                        container.appendChild(qDiv);
                        
                        globalQuestionIndex++;
                    });
                }
            });
        }

        function calculateResults() {
            const form = document.getElementById('quizForm');
            const formData = new FormData(form);
            
            let answersCount = 0;
            for(let key of formData.keys()) answersCount++;

            if(answersCount < orderedAndShuffledQuestions.length) {
                alert("Por favor, responda a todas as questões antes de finalizar o simulado.");
                return;
            }

            let scores = {};
            disciplineOrder.forEach(d => scores[d] = { correct: 0, total: 0 });

            let totalCorrect = 0;
            let totalQuestions = orderedAndShuffledQuestions.length;
            
            form.style.display = 'none';
            document.querySelector('.header-info').style.display = 'none';
            
            const resultContainer = document.getElementById('result-container');
            const resultsList = document.getElementById('resultsList');
            const detailedFeedback = document.getElementById('detailedFeedback');
            
            let feedbackHtml = `<h3>Correção Detalhada das Questões:</h3>`;

            disciplineOrder.forEach(discipline => {
                let questionsOfDiscipline = orderedAndShuffledQuestions.filter(q => q.discipline === discipline);
                
                if(questionsOfDiscipline.length > 0) {
                    feedbackHtml += `
                    <div class="feedback-section">
                        <div class="feedback-header">${discipline}</div>
                        <ul class="feedback-list">
                    `;

                    questionsOfDiscipline.forEach(q => {
                        let answerStr = formData.get(`q${q.displayNumber}`);
                        let isCorrect = answerStr === "true";
                        
                        scores[discipline].total += 1;
                        if(isCorrect) {
                            scores[discipline].correct += 1;
                            totalCorrect += 1;
                        }
                        
                        let correctAnswerText = q.options.find(o => o.isCorrect).text;
                        
                        // Limpa as tags HTML para o resumo
                        let cleanText = q.text.replace(/<[^>]*>?/gm, '');
                        if(cleanText.length > 100) cleanText = cleanText.substring(0, 100) + '...';

                        let statusClass = isCorrect ? 'q-correct' : 'q-incorrect';
                        let statusText = isCorrect ? '✅ Você Acertou' : '❌ Você Errou';

                        feedbackHtml += `
                            <li class="${statusClass}">
                                <div class="q-title">Questão ${q.displayNumber} - ${statusText}</div>
                                <div class="q-answer">${cleanText}</div>
                                ${!isCorrect ? `<div class="q-correct-answer">A resposta correta era: ${correctAnswerText}</div>` : ''}
                            </li>
                        `;
                    });
                    
                    feedbackHtml += `</ul></div>`;
                }
            });

            let summaryHtml = `
                <div class="result-item total">
                    <span>Acertos Totais:</span>
                    <span>${totalCorrect} de ${totalQuestions} (${Math.round((totalCorrect/totalQuestions)*100)}%)</span>
                </div>
                <h3>Resumo por Disciplina:</h3>
            `;

            disciplineOrder.forEach(discipline => {
                let data = scores[discipline];
                if(data.total > 0) {
                    let percentage = Math.round((data.correct / data.total) * 100);
                    let color = percentage >= 60 ? 'green' : (percentage >= 40 ? 'orange' : 'red');
                    summaryHtml += `
                        <div class="result-item">
                            <span><strong>${discipline}</strong></span>
                            <span>
                                ${data.correct} / ${data.total} 
                                <span style="color:${color}; font-weight:bold; margin-left: 10px;">(${percentage}%)</span>
                            </span>
                        </div>
                    `;
                }
            });

            resultsList.innerHTML = summaryHtml;
            detailedFeedback.innerHTML = feedbackHtml;
            resultContainer.style.display = 'block';
            window.scrollTo(0, 0);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', renderQuiz);
        } else {
            renderQuiz();
        }
    </script>
</body>
</html>
